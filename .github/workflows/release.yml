name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          .\package_release.ps1 -Version $version
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem dist\*.zip | Select-Object -First 1
          if (-not $archive) { throw "Release archive missing" }
          gh release create "${{ github.ref_name }}" $archive.FullName --generate-notes --verify-tag
