name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build release package
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          dotnet build overlay_cs\SystemAudioOverlay.csproj --configuration Release
          dotnet build overlay_cs\OverlayCapture.csproj --configuration Release
          .\package_release.ps1 -Version $version -SkipBuild
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem dist\*.zip | Select-Object -First 1
          if (-not $archive) { throw "Release archive missing" }
          gh release create "${{ github.ref_name }}" $archive.FullName --generate-notes --verify-tag
